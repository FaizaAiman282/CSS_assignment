<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Fixes</title>
    <style>
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        .loader {
            border: 5px solid grey;
            height: 50px;
            width: 50px;
            border-top-color: rgb(217, 113, 113);
            border-radius: 50%;
            animation: spinner 2s linear infinite;
        }
        @keyframes spinner {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .box {
            height: 40px;
            width: 160px;
            border: 2px solid gray;
            display: flex;
            align-items: center;
            padding: 0 2px;
        }
        .ball {
            background-color: brown;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            position: relative;
            
            animation: move 1.5s linear infinite alternate;
        }
        @keyframes move {
            0% { left: 0px; }
            100% { left: 120px; } 
        }

        h1 {
            font-size: 30px;
            position: relative;
            /* Use alternate so it transitions back down smoothly */
            animation: bounce 0.6s ease-in-out infinite alternate;
        }
        @keyframes bounce {
            0% { top: 0px; }
            100% { top: -15px; } 
        }

        .frame {
            height: 110px;
            width: 45px;
            background-color: rgb(53, 52, 52);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px 0;
        }
        .lights1, .lights2, .lights3 {
            height: 25px;
            width: 25px;
            border-radius: 50%;
            opacity: 0.2; 
        }
        
        .lights1 {
            background-color: red;
            animation: trafficSequence 6s infinite;
        }
        .lights2 {
            background-color: yellow;
            animation: trafficSequence 6s infinite 2s; 
        }
        .lights3 {
            background-color: green;
            animation: trafficSequence 6s infinite 4s;
        }

        @keyframes trafficSequence {
            0%, 33.3% { opacity: 1; }     
            33.4%, 100% { opacity: 0.2; }  
        }
    </style>
</head>
<body>
<div class="container">
    <div class="loader"></div>
    
    <div class="box">
        <div class="ball"></div>
    </div>
    
    <h1>WELCOME</h1>
    
    <div class="frame">
        <div class="lights1"></div>
        <div class="lights2"></div>
        <div class="lights3"></div>
    </div>
</div>
</body>
</html>
