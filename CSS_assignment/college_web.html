<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: antiquewhite;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            background-color: darkblue;
            padding: 15px;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Logo */
        .image {
            width: 100px;
            height: 80px;
        }

        /* Menu Links */
        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            padding: 10px;
        }

        .menu a:hover {
            background-color: rgb(25, 25, 150);
            border-radius: 5px;
        }

        /* Hero Section */
        .hero {
            margin: 40px 0;
        }

        .hero h2 {
            margin-bottom: 20px;
        }

        button {
            height: 40px;
            width: 120px;
            background-color: rgb(128, 119, 136);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Features Section */
        .features {
            margin: 100px 0 250px;
        }

        .features a {
            color: black;
            text-decoration: none;
            font-size: 22px;
            margin: 0 15px;
        }

        /* Footer */
        footer {
            background-color: rgb(51, 51, 89);
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        /* Mobile View */
        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                align-items: stretch;
            }

            .image {
                margin: 0 auto 10px;
            }

            .menu {
                flex-direction: column;
                width: 100%;
                gap: 0;
            }

            .menu a {
                display: block;
                width: 100%;
                text-align: center;
                border-top: 1px solid rgba(255, 255, 255, 0.3);
            }

            .features a {
                display: block;
                margin: 15px 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <img src="cvr.png" alt="Logo" class="image">

            <div class="menu">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome</h2>
        <button>Register</button>
    </section>

    <section class="features">
        <a href="#">Student Registration</a>
        <a href="#">Attendance</a>
        <a href="#">Results</a>
    </section>

    <footer>
        For any queries please navigate to Contact
    </footer>

</body>
</html>
