<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            border:2px solid black;
            height: 200px;
            width:500px;
            padding: 20px;
        }
        .image{
            height: 100px;
            width:100px;
        }
        img:hover{
            scale: 1.3;
        }
        button{
            background-color: cornflowerblue;
            animation: hover 2s linear infinite;
        }
        @keyframes hover {
            100%{background-color: darkcyan; scale: 1.2;}
        }
        
    </style>
</head>
<body>
    <div class="card">
        <div class="image">
            <img src="donuts.png">
        </div>
        <div class="content">
            <h2>Donuts</h2>
            <h2>10$</h2>
            <button>Buy</button>
        </div>
    </div>
</body>
</html>
