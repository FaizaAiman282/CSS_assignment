<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            height: 300px;
            width: 300px;
            background-color: beige;
            border-radius: 4px;
            text-align: center;
            padding-top: auto;
        }
        img{
            height: 200px;
            width: 200px;
        }
        img:hover{
            scale: 1.2;
            transition:all 0.4s ease; 
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="6.png">
    </div>
</body>
</html>
