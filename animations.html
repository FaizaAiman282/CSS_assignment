<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .loader{
            border: 5px solid grey;
            height: 50px;
            width:50px;
            border-top-color: rgb(217, 113, 113);
            border-radius: 50%;
            animation-name: spinner;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            position: relative;
            margin:40px;
        }
        @keyframes spinner {
            from{transform: rotate(0deg);}
            to{transform: rotate(360deg);}
        }
        .box{
            height:60px;
            width:150px;
            border: 2px solid gray;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .ball{
            background-color: brown;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            animation-name: move;
            position: relative;
            animation-duration: 2s;
            animation-direction: linear;
            animation-iteration-count: infinite;
        }
        @keyframes move {
        0%{left:0px; right:150px;}
        50%{left: 120px; right:0px;}
        100%{left:0px; right:150px;}
            
        }
        .container{
            display: flex;
            flex-direction: column;
           align-items: center;
        }
        h1{
            font-size: 30px;
            animation: bounce 2s linear  infinite  ;
            position: relative;
            
        }
        @keyframes bounce {
            0%{top:0px;}
            25%{top: 20px;}
            50%{top:0px;}
            100%{top:20%}
        }
        .frame{
            height:90px;
            width:40px;
            background-color: rgb(53, 52, 52);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding:10px;

        }
        .lights1{
            height: 20px;
            width: 20px;
            border-radius: 50%;
            margin-bottom:10px;
            animation: redlight 2s linear  infinite ;
            background-color: red;
        }
        
        .lights2{
            height: 20px;
            width: 20px;
            background-color: rgb(144, 134, 134);
            border-radius: 50%;
            margin-bottom:10px;
            animation: yellowlight 2s linear  infinite 2s ;
            background-color: yellow;
        }
        .lights3{
            height: 20px;
            width: 20px;
            background-color: rgb(144, 134, 134);
            border-radius: 50%;
            margin-bottom:10px;
            animation: greenlight 2s linear  infinite 4s ;
            background-color: green;
        }
        @keyframes redlight {
            from{opacity: 0.2;}
            to{opacity: 1;}
        }
        @keyframes yellowlight {
            from{opacity: 0.2;}
            to{opacity: 1;}
        }
        @keyframes greenlight {
            from{opacity: 0.2;}
            to{opacity: 1;}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="loader"></div>
    <div class="box">
        <div class="ball"></div>
    </div>
    <h1>WELCOME</h1>
    <div class="frame">
    <div class="lights1"></div>
    <div class="lights2"></div>
    <div class="lights3"></div>
    </div>
</div>
</body>
</html>
