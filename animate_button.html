<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            height:60px;
            width:70px;
            color:black;
            background-color: aqua;
            
        }
        button:hover{
            background-color: greenyellow;
            scale: 1.1;
            transition: all 0.5s;

        }
    </style>
</head>
<body>
    <h1>Move to the pointer to the button to see the changes</h1>
    <button>click me</button>
</body>
</html>
